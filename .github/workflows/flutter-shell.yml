name: flutter-shell

on:
  workflow_dispatch:
  push:
    tags:
      - 'flutter-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: oct-shell-windows-x64
          - os: macos-latest
            target: macos
            artifact: oct-shell-macos-universal
          - os: ubuntu-22.04
            target: linux
            artifact: oct-shell-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/flutter
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: flutter --version

      - name: Generate platform scaffolding (windows/macos/linux runners are generated, not committed)
        shell: bash
        run: |
          flutter create --platforms=${{ matrix.target }} --project-name oct_shell --org com.oct .
          rm -f test/widget_test.dart

      - name: Deps
        run: flutter pub get

      - name: Analyze (non fatal)
        continue-on-error: true
        run: flutter analyze

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.target }} --release

      - name: Package (windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/windows/x64/runner/Release/. out/
          cd out && 7z a -tzip ../${{ matrix.artifact }}.zip . > /dev/null

      - name: Package (macos)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/macos/Build/Products/Release/*.app out/
          cd out && zip -qry ../${{ matrix.artifact }}.zip .

      - name: Package (linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/linux/x64/release/bundle/. out/
          cd out && zip -qry ../${{ matrix.artifact }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/flutter/${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -lh
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd dist
          TAG=flutter-shell
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "OCT Flutter shell (preview)" \
              --notes "Flutter 桌面外壳预览：纯 logo 启动页、通道列表与详情、实时日志、托盘图标与菜单、关闭确认（最小化/退出）。隧道核心仍是 Node SEA 打包的 oct.exe，请配合 1.6.x 安装包使用。"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.zip SHA256SUMS
