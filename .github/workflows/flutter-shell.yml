name: flutter-shell

on:
  workflow_dispatch:
  push:
    tags:
      - 'flutter-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: oct-shell-windows-x64
            coreasset: oct-core-windows-x64.zip
            cflurl: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          - os: macos-latest
            target: macos
            artifact: oct-shell-macos-arm64
            coreasset: oct-core-macos-arm64.tar.gz
            cflurl: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          - os: macos-15-intel
            target: macos
            artifact: oct-shell-macos-x64
            coreasset: oct-core-macos-x64.tar.gz
            cflurl: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz
          - os: ubuntu-22.04
            target: linux
            artifact: oct-shell-linux-x64
            coreasset: oct-core-linux-x64.tar.gz
            cflurl: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: flutter --version

      - name: Generate platform scaffolding (runners are generated, not committed)
        shell: bash
        run: |
          flutter create --platforms=${{ matrix.target }} --project-name oct_shell --org com.oct .
          rm -f test/widget_test.dart

      - name: Deps
        run: flutter pub get

      - name: Analyze (non fatal)
        continue-on-error: true
        run: flutter analyze

      - name: Build shell
        shell: bash
        run: flutter build ${{ matrix.target }} --release

      - name: Download cloudflared
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          curl -fsSL -o cf-download '${{ matrix.cflurl }}'
          if [ '${{ matrix.target }}' = 'macos' ]; then
            tar -xzf cf-download && rm -f cf-download && chmod +x cloudflared
          elif [ '${{ matrix.target }}' = 'windows' ]; then
            mv cf-download cloudflared.exe
          else
            mv cf-download cloudflared && chmod +x cloudflared
          fi
          ls -lh cloudflared*

      - name: Build the core (Node SEA, same commit as the shell)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          node --version
          node build/make-exe.mjs
          ls -lh dist

      - name: Smoke-test the core binary (version / help / daemon / HTTP API)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          BIN=dist/oct
          if [ -f dist/oct.exe ]; then BIN=dist/oct.exe; fi
          "$BIN" version
          "$BIN" help | head -3
          SMOKE=.smoke
          rm -rf "$SMOKE"; mkdir -p "$SMOKE"
          "$BIN" daemon start --config "$SMOKE/config.json"
          sleep 3
          PORT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).port)" "$SMOKE/state/daemon.json")
          echo "daemon port: $PORT"
          curl -fsS "http://127.0.0.1:$PORT/api/health"; echo
          "$BIN" list --config "$SMOKE/config.json" | head -6
          "$BIN" daemon stop --config "$SMOKE/config.json"
          rm -rf "$SMOKE"

      - name: Package (windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/windows/x64/runner/Release/. out/

      - name: Package (macos)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/macos/Build/Products/Release/*.app out/

      - name: Package (linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p out
          cp -r build/linux/x64/release/bundle/. out/

      - name: Bundle the core into the shell package
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          if [ '${{ matrix.target }}' = 'windows' ]; then
            cp -r dist/. app/flutter/out/
          else
            cp dist/oct dist/cloudflared app/flutter/out/
            chmod +x app/flutter/out/oct app/flutter/out/cloudflared
          fi
          printf '%s\n' \
            '这是 OCT（一键隧道）的桌面外壳预览版，核心（oct / cloudflared）已经打包在同一目录里。' \
            '' \
            '  新界面：打开 oct_shell（Windows 上是 oct_shell.exe）' \
            '  命令行：./oct help              看全部命令' \
            '          ./oct daemon start      只起后台守护进程（不弹浏览器）' \
            '' \
            '外壳第一次打开时会自动在后台执行 oct daemon start；托盘图标在右下角；' \
            '点窗口右上角的 × 会问你「最小化到托盘」还是「退出（并停掉所有通道）」。' \
            '通道数据是同一份 config.json。' > app/flutter/out/START-HERE.txt
          ls -lh app/flutter/out | head -25

      - name: Core-only archive (for people who only want the engine)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          rm -rf core-out; mkdir -p core-out
          if [ '${{ matrix.target }}' = 'windows' ]; then
            cp -r dist/. core-out/
            (cd core-out && 7z a -tzip "../app/flutter/${{ matrix.coreasset }}" . > /dev/null)
          else
            cp dist/oct dist/cloudflared core-out/
            chmod +x core-out/oct core-out/cloudflared
            tar -czf "app/flutter/${{ matrix.coreasset }}" -C core-out .
          fi
          ls -lh "app/flutter/${{ matrix.coreasset }}"

      - name: Zip the shell (windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cd out && 7z a -tzip "../${{ matrix.artifact }}.zip" . > /dev/null
          ls -lh ..

      - name: Report architecture (macOS only)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          echo "host arch: $(uname -m)"
          flutter --version | head -2
          APP=build/macos/Build/Products/Release/oct_shell.app
          echo "runner exe: $(lipo -archs "$APP/Contents/MacOS/oct_shell" 2>/dev/null || file "$APP/Contents/MacOS/oct_shell")"
          for f in "$APP"/Contents/Frameworks/*.framework/Versions/A/*; do
            if [ -f "$f" ] && file "$f" | grep -q Mach-O; then echo "$(basename "$f"): $(lipo -archs "$f" 2>/dev/null)"; fi
          done

      - name: Archive the raw .app for the universal merge (macOS only)
        if: matrix.target == 'macos'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          ARCH="${ARTIFACT#oct-shell-macos-}"
          tar -czf "macos-app-${ARCH}.tar.gz" -C build/macos/Build/Products/Release oct_shell.app
          ls -lh macos-app-*.tar.gz

      - name: Zip the shell (macos / linux)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          cd out && zip -qry "../${{ matrix.artifact }}.zip" .
          ls -lh ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/flutter/${{ matrix.artifact }}.zip
            app/flutter/${{ matrix.coreasset }}
            app/flutter/macos-app-*.tar.gz
          if-no-files-found: error

  macos-universal:
    name: merge macOS arm64 + x64 into one universal package
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true

      - name: lipo merge (.app + oct + cloudflared)
        shell: bash
        run: |
          set -e
          ls -lh dl
          mkdir -p a64 x64 core-arm64 core-x64 uni
          tar -xzf dl/macos-app-arm64.tar.gz -C a64
          tar -xzf dl/macos-app-x64.tar.gz -C x64
          tar -xzf dl/oct-core-macos-arm64.tar.gz -C core-arm64
          tar -xzf dl/oct-core-macos-x64.tar.gz -C core-x64
          A=$(lipo -archs a64/oct_shell.app/Contents/MacOS/oct_shell)
          B=$(lipo -archs x64/oct_shell.app/Contents/MacOS/oct_shell)
          echo "arm64-build app arch: $A"
          echo "x64-build app arch:   $B"
          cp -R a64/oct_shell.app uni/
          if [ "$A" != "$B" ]; then
            cd a64
            find oct_shell.app -type f -print0 | while IFS= read -r -d '' f; do
              if [ -f "../x64/$f" ] && file "$f" | grep -q 'Mach-O'; then
                lipo -create "$f" "../x64/$f" -output "../uni/$f"
              fi
            done
            cd ..
          else
            echo "app 本身已经是通用二进制（$A），不用再合并"
          fi
          CA=$(lipo -archs core-arm64/oct)
          CB=$(lipo -archs core-x64/oct)
          echo "arm64 构建的核心架构: $CA"
          echo "x64   构建的核心架构: $CB"
          if [ "$CA" != "$CB" ]; then
            lipo -create core-arm64/oct core-x64/oct -output uni/oct
            lipo -create core-arm64/cloudflared core-x64/cloudflared -output uni/cloudflared
          else
            echo "::warning::两个核心的架构相同（$CA），通用包里只有这一个架构"
            cp core-arm64/oct uni/oct
            cp core-arm64/cloudflared uni/cloudflared
          fi
          chmod +x uni/oct uni/cloudflared
          chmod +x uni/oct uni/cloudflared
          codesign --force --deep --sign - uni/oct_shell.app
          codesign --force --sign - uni/oct
          codesign --force --sign - uni/cloudflared
          echo "--- arch check: each of these must list BOTH x86_64 and arm64"
          lipo -info uni/oct_shell.app/Contents/MacOS/oct_shell
          lipo -info uni/oct
          lipo -info uni/cloudflared

      - name: Smoke-test the universal core (runs the arm64 slice)
        shell: bash
        run: |
          set -e
          ./uni/oct version
          SMOKE=.smoke
          rm -rf "$SMOKE"; mkdir -p "$SMOKE"
          ./uni/oct daemon start --config "$SMOKE/config.json"
          sleep 3
          PORT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).port)" "$SMOKE/state/daemon.json")
          echo "daemon port: $PORT"
          curl -fsS "http://127.0.0.1:$PORT/api/health"; echo
          ./uni/oct daemon stop --config "$SMOKE/config.json"
          rm -rf "$SMOKE"

      - name: Package the universal zip
        shell: bash
        run: |
          set -e
          printf '%s\n' \
            'OCT universal package (Apple Silicon + Intel in one app / one core)' \
            '' \
            '  GUI:  open oct_shell.app' \
            '  CLI:  ./oct help' \
            '' \
            'oct_shell.app, oct and cloudflared are all lipo-merged universal binaries (x86_64 + arm64).' > uni/START-HERE.txt
          cd uni && zip -qry -y ../oct-shell-macos-universal.zip .
          ls -lh ../oct-shell-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oct-shell-macos-universal
          path: oct-shell-macos-universal.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f macos-app-*.tar.gz
          ls -lh
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd dist
          TAG=flutter-shell
          NOTES="OCT 桌面外壳预览（Flutter）：纯 logo 启动页、通道列表与详情、实时日志、托盘图标与菜单、关闭确认（最小化/退出）。三平台的包都已经自带同一份源码编出来的核心：Windows 是 oct.exe，macOS / Linux 是 oct，外加 cloudflared；解压打开 oct_shell 就能用，不用再单独下载核心。另有只含引擎的 oct-core-* 压缩包。"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "OCT desktop shell (Flutter, preview)" --notes "$NOTES"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.zip *.tar.gz SHA256SUMS
